name: CI

on:
  push:
    branches: [master]
  pull_request: ~
  workflow_dispatch: ~

jobs:
  # build checks that the app can build and runs tests on the latest node version
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:-/tmp}/just-bin"
          mkdir -p "$install_dir"
          # Resolve the latest release tag via the github.com redirect to avoid
          # api.github.com rate limits on shared runner egress IPs.
          latest_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest)
          just_version="${latest_url##*/tag/}"
          case "$RUNNER_OS" in
            Windows) asset="just-${just_version}-x86_64-pc-windows-msvc.zip" ;;
            macOS)   asset="just-${just_version}-x86_64-apple-darwin.tar.gz" ;;
            *)       asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz" ;;
          esac
          curl -fL "https://github.com/casey/just/releases/download/${just_version}/${asset}" -o "$install_dir/$asset"
          case "$asset" in
            *.zip) unzip -o "$install_dir/$asset" -d "$install_dir" ;;
            *)     tar -xzf "$install_dir/$asset" -C "$install_dir" ;;
          esac
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: EASYPOST_TEST_API_KEY=123 EASYPOST_PROD_API_KEY=123 just install install-styleguide build test
  # node-compatibility checks that the build version of the app can be imported
  # and used on older versions of node
  node-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x, 17.x, 18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x]
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:-/tmp}/just-bin"
          mkdir -p "$install_dir"
          # Resolve the latest release tag via the github.com redirect to avoid
          # api.github.com rate limits on shared runner egress IPs.
          latest_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest)
          just_version="${latest_url##*/tag/}"
          case "$RUNNER_OS" in
            Windows) asset="just-${just_version}-x86_64-pc-windows-msvc.zip" ;;
            macOS)   asset="just-${just_version}-x86_64-apple-darwin.tar.gz" ;;
            *)       asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz" ;;
          esac
          curl -fL "https://github.com/casey/just/releases/download/${just_version}/${asset}" -o "$install_dir/$asset"
          case "$asset" in
            *.zip) unzip -o "$install_dir/$asset" -d "$install_dir" ;;
            *)     tar -xzf "$install_dir/$asset" -C "$install_dir" ;;
          esac
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: EASYPOST_TEST_API_KEY=123 EASYPOST_PROD_API_KEY=123 just install install-styleguide build
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: EASYPOST_TEST_API_KEY=123 EASYPOST_PROD_API_KEY=123 just test-node-compatibility
  # typescript checks that the our Typescript definitions can be compiled without errors
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:-/tmp}/just-bin"
          mkdir -p "$install_dir"
          # Resolve the latest release tag via the github.com redirect to avoid
          # api.github.com rate limits on shared runner egress IPs.
          latest_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest)
          just_version="${latest_url##*/tag/}"
          case "$RUNNER_OS" in
            Windows) asset="just-${just_version}-x86_64-pc-windows-msvc.zip" ;;
            macOS)   asset="just-${just_version}-x86_64-apple-darwin.tar.gz" ;;
            *)       asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz" ;;
          esac
          curl -fL "https://github.com/casey/just/releases/download/${just_version}/${asset}" -o "$install_dir/$asset"
          case "$asset" in
            *.zip) unzip -o "$install_dir/$asset" -d "$install_dir" ;;
            *)     tar -xzf "$install_dir/$asset" -C "$install_dir" ;;
          esac
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: |
          cd types/demo
          npm install
          cd ../../
          just install install-styleguide typescript
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:-/tmp}/just-bin"
          mkdir -p "$install_dir"
          # Resolve the latest release tag via the github.com redirect to avoid
          # api.github.com rate limits on shared runner egress IPs.
          latest_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest)
          just_version="${latest_url##*/tag/}"
          case "$RUNNER_OS" in
            Windows) asset="just-${just_version}-x86_64-pc-windows-msvc.zip" ;;
            macOS)   asset="just-${just_version}-x86_64-apple-darwin.tar.gz" ;;
            *)       asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz" ;;
          esac
          curl -fL "https://github.com/casey/just/releases/download/${just_version}/${asset}" -o "$install_dir/$asset"
          case "$asset" in
            *.zip) unzip -o "$install_dir/$asset" -d "$install_dir" ;;
            *)     tar -xzf "$install_dir/$asset" -C "$install_dir" ;;
          esac
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: just install install-styleguide build lint
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:-/tmp}/just-bin"
          mkdir -p "$install_dir"
          # Resolve the latest release tag via the github.com redirect to avoid
          # api.github.com rate limits on shared runner egress IPs.
          latest_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest)
          just_version="${latest_url##*/tag/}"
          case "$RUNNER_OS" in
            Windows) asset="just-${just_version}-x86_64-pc-windows-msvc.zip" ;;
            macOS)   asset="just-${just_version}-x86_64-apple-darwin.tar.gz" ;;
            *)       asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz" ;;
          esac
          curl -fL "https://github.com/casey/just/releases/download/${just_version}/${asset}" -o "$install_dir/$asset"
          case "$asset" in
            *.zip) unzip -o "$install_dir/$asset" -d "$install_dir" ;;
            *)     tar -xzf "$install_dir/$asset" -C "$install_dir" ;;
          esac
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: just install install-styleguide build
      - run: EASYPOST_TEST_API_KEY=123 EASYPOST_PROD_API_KEY=123 just coverage
      - name: Coverage
        if: github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:-/tmp}/just-bin"
          mkdir -p "$install_dir"
          # Resolve the latest release tag via the github.com redirect to avoid
          # api.github.com rate limits on shared runner egress IPs.
          latest_url=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/casey/just/releases/latest)
          just_version="${latest_url##*/tag/}"
          case "$RUNNER_OS" in
            Windows) asset="just-${just_version}-x86_64-pc-windows-msvc.zip" ;;
            macOS)   asset="just-${just_version}-x86_64-apple-darwin.tar.gz" ;;
            *)       asset="just-${just_version}-x86_64-unknown-linux-musl.tar.gz" ;;
          esac
          curl -fL "https://github.com/casey/just/releases/download/${just_version}/${asset}" -o "$install_dir/$asset"
          case "$asset" in
            *.zip) unzip -o "$install_dir/$asset" -d "$install_dir" ;;
            *)     tar -xzf "$install_dir/$asset" -C "$install_dir" ;;
          esac
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: just install
      - name: Generate Docs
        run: just docs
      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
